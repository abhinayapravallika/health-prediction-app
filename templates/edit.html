<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container mt-5">

    <div class="shadow-box">

        <h2>Edit Patient</h2>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input
                    type="text"
                    name="full_name"
                    value="{{ patient.full_name }}"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Date of Birth</label>
                <input
                    type="date"
                    name="dob"
                    value="{{ patient.dob }}"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input
                    type="email"
                    name="email"
                    value="{{ patient.email }}"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Glucose</label>
                <input
                    type="number"
                    step="0.1"
                    name="glucose"
                    value="{{ patient.glucose }}"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Haemoglobin</label>
                <input
                    type="number"
                    step="0.1"
                    name="haemoglobin"
                    value="{{ patient.haemoglobin }}"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Cholesterol</label>
                <input
                    type="number"
                    step="0.1"
                    name="cholesterol"
                    value="{{ patient.cholesterol }}"
                    class="form-control"
                    required>
            </div>

            <button type="submit" class="btn btn-primary">
                Update Patient
            </button>

            <a href="/" class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

</body>

</html>
